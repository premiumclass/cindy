<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>노트 양식 출력</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --line: #c4ced8;
    --margin-line: #e8bcc1;
    --frame: #cfd6dc;
    --tag-bg: #e7eee5;
    --tag-ink: #4c5f4d;
    --ink: #3d4950;
    --ink-soft: #7d8a92;

    --app-bg: #eef1ee;
    --panel: #ffffff;
    --panel-line: #dde2dd;
    --text: #2f3a35;
    --text-soft: #6b7670;
    --accent: #5d7a62;
    --accent-ink: #ffffff;
    --danger: #b2474f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --app-bg: #1c211f;
      --panel: #262c29;
      --panel-line: #39413d;
      --text: #e4eae6;
      --text-soft: #a3aea8;
      --accent: #8fb595;
      --accent-ink: #17201a;
      --danger: #e5878e;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--app-bg);
    color: var(--text);
    font-family: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }

  /* ---------- 앱 화면 ---------- */
  .app { display: flex; gap: 24px; padding: 24px; align-items: flex-start; }
  .panel {
    width: 300px; flex-shrink: 0;
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px;
    padding: 22px 20px; position: sticky; top: 24px;
  }
  .panel h1 { font-family: "Gowun Batang", serif; font-size: 22px; font-weight: 700; margin: 0 0 20px; }
  .field-group { margin-bottom: 18px; }
  .field-group > label, .group-title { display: block; font-size: 14px; color: var(--text-soft); margin-bottom: 6px; }
  .panel select, .panel input[type="text"], .panel input[type="number"] {
    width: 100%; height: 38px; padding: 0 10px; font: inherit; font-size: 15px;
    color: var(--text); background: var(--app-bg); border: 1px solid var(--panel-line); border-radius: 8px;
  }
  .panel input:focus-visible, .panel select:focus-visible, .print-btn:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .range-row { display: flex; align-items: center; gap: 10px; }
  .range-row input { flex: 1; accent-color: var(--accent); }
  .range-row output { min-width: 52px; text-align: right; font-size: 15px; }
  .check, .radio { display: flex; align-items: center; gap: 8px; font-size: 15px; cursor: pointer; padding: 3px 0; }
  .check input, .radio input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0 6px 0 0; flex-shrink: 0; }
  .radio.is-disabled { color: var(--text-soft); opacity: 0.55; cursor: not-allowed; }
  .field-group.is-disabled { opacity: 0.45; }
  .field-group.is-disabled input { cursor: not-allowed; }
  .hint { font-size: 13px; color: var(--text-soft); line-height: 1.55; margin: 6px 0 0; }
  .divider { border: 0; border-top: 1px solid var(--panel-line); margin: 20px 0; }
  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translate(-50%, 12px);
    background: var(--text); color: var(--panel); font-size: 15px;
    padding: 12px 20px; border-radius: 10px; opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease; z-index: 10; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
  .print-btn {
    width: 100%; height: 44px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-size: 16px;
  }
  .print-btn:hover { filter: brightness(1.05); }
  .print-btn:active { transform: scale(0.99); }

  .stage { flex: 1; min-width: 0; display: flex; justify-content: center; }
  .scaler-wrap { position: relative; }
  .scaler { transform-origin: top left; position: absolute; top: 0; left: 0; }
  .scaler .sheet { box-shadow: 0 1px 3px rgba(40, 55, 45, 0.12), 0 8px 28px rgba(40, 55, 45, 0.10); }

  @media (max-width: 860px) {
    .app { flex-direction: column; padding: 16px; }
    .panel { width: 100%; position: static; }
    .stage { width: 100%; }
  }

  /* ---------- 시험지 (A4) ---------- */
  .sheet {
    width: 210mm; height: 297mm; background: #fff; color: var(--ink);
    padding: 13mm 15mm; display: flex; flex-direction: column; overflow: hidden;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .sheet-head {
    height: 12mm; flex-shrink: 0; display: flex; align-items: flex-end; justify-content: space-between;
    padding-bottom: 2.2mm; border-bottom: 0.3mm solid var(--line); margin-bottom: 5mm;
  }
  .academy { font-family: "Gowun Batang", serif; font-size: 16pt; font-weight: 700; letter-spacing: 0.02em; }
  .head-fields { display: flex; gap: 7mm; font-size: 10.5pt; color: var(--ink-soft); }
  .head-field { display: flex; align-items: flex-end; gap: 2mm; }
  .head-field .blank-line { display: inline-block; border-bottom: 0.3mm solid var(--line); height: 5mm; }

  .sections { flex: 1; display: flex; flex-direction: column; gap: 6mm; min-height: 0; }
  .sec { display: flex; flex-direction: column; min-height: 0; }
  .sec.r7 { flex: 7; }
  .sec.r3 { flex: 3; }
  .tag-row { height: 8mm; flex-shrink: 0; display: flex; align-items: flex-start; }
  .tag {
    font-family: "Gowun Batang", serif; font-size: 10.5pt; font-weight: 700;
    background: var(--tag-bg); color: var(--tag-ink);
    padding: 1mm 3.6mm; border-radius: 10mm; line-height: 1.35;
  }
  .box {
    flex: 1; min-height: 0; position: relative; overflow: hidden;
    border: 0.3mm solid var(--frame); border-radius: 3mm;
  }
  .ln { position: absolute; left: 0; right: 0; border-top: 0.25mm solid var(--line); }
  .gv { position: absolute; top: 0; bottom: 0; border-left: 0.2mm solid var(--line); }
  .gh { position: absolute; left: 0; right: 0; border-top: 0.2mm solid var(--line); }

  /* ---------- 인쇄 ---------- */
  #printArea { display: none; }
  @page { size: A4 portrait; margin: 0; }
  @media print {
    html, body { background: #fff; }
    .app { display: none !important; }
    #printArea { display: block; }
    #printArea .sheet { break-after: page; page-break-after: always; }
    #printArea .sheet:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="panel">
    <h1>노트 양식 출력</h1>

    <div class="field-group">
      <label for="template">양식</label>
      <select id="template"></select>
    </div>

    <div class="field-group">
      <label for="academy">학원명</label>
      <input type="text" id="academy" placeholder="학원명을 입력하세요" maxlength="40">
    </div>

    <div class="field-group">
      <label for="gap">줄 간격</label>
      <div class="range-row">
        <input type="range" id="gap" min="6" max="12" step="0.5">
        <output id="gapOut"></output>
      </div>
    </div>

    <div class="field-group">
      <label for="grid">모눈 간격</label>
      <div class="range-row">
        <input type="range" id="grid" min="3" max="10" step="0.5">
        <output id="gridOut"></output>
      </div>
    </div>

    <hr class="divider">

    <div class="field-group">
      <label class="check"><input type="checkbox" id="duplexPrinter">양면 프린터 사용</label>
    </div>

    <div class="field-group">
      <span class="group-title">출력 모드</span>
      <label class="radio" id="radioSingle"><input type="radio" name="mode" value="single">단면 출력</label>
      <label class="radio" id="radioDouble"><input type="radio" name="mode" value="double">양면 출력</label>
      <p class="hint" id="modeHint"></p>
    </div>

    <div class="field-group">
      <label for="copies">출력 부수</label>
      <input type="number" id="copies" min="1" max="500" step="1" placeholder="부수 입력">
    </div>

    <button class="print-btn" id="printBtn" type="button">출력</button>
    <p class="hint">인쇄창에서 배율은 기본값(100%)으로 두세요. 양면 프린터를 사용할 땐 인쇄창의 양면 인쇄도 켜져 있어야 해요.</p>
  </aside>

  <main class="stage" id="stage">
    <div class="scaler-wrap" id="scalerWrap">
      <div class="scaler" id="scaler"></div>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div id="printArea"></div>

<script>
(function () {
  "use strict";

  /* ===== 양식 정의 (새 양식은 여기에 추가) ===== */
  var TEMPLATES = {
    reading: {
      name: "독해 시험지",
      sections: [
        { title: "해석 시험", ratio: 7, lined: true },
        { title: "구문 시험", ratio: 3, lined: false }
      ]
    },
    grammar: {
      name: "문법 시험지",
      sections: [
        { title: "개념 시험", ratio: 7, lined: false },
        { title: "어구 시험", ratio: 3, lined: false }
      ]
    },
    lineNote: {
      name: "줄 노트",
      sections: [
        { title: "", ratio: 1, lined: true }
      ]
    },
    gridNote: {
      name: "모눈 노트",
      sections: [
        { title: "", ratio: 1, grid: true }
      ]
    }
  };

  var MM_PER_PX = 25.4 / 96;
  var STORE = "notes:settings";

  var el = {
    template: document.getElementById("template"),
    academy: document.getElementById("academy"),
    gap: document.getElementById("gap"),
    gapOut: document.getElementById("gapOut"),
    grid: document.getElementById("grid"),
    gridOut: document.getElementById("gridOut"),
    duplexPrinter: document.getElementById("duplexPrinter"),
    radioSingle: document.getElementById("radioSingle"),
    radioDouble: document.getElementById("radioDouble"),
    modeHint: document.getElementById("modeHint"),
    copies: document.getElementById("copies"),
    toast: document.getElementById("toast"),
    printBtn: document.getElementById("printBtn"),
    stage: document.getElementById("stage"),
    scalerWrap: document.getElementById("scalerWrap"),
    scaler: document.getElementById("scaler"),
    printArea: document.getElementById("printArea")
  };
  var modeInputs = document.querySelectorAll('input[name="mode"]');

  /* ===== 설정 저장/불러오기 ===== */
  var state = { template: "reading", academy: "", gap: 8, gridGap: 5, duplexPrinter: true, mode: "single" };
  try {
    var saved = JSON.parse(localStorage.getItem(STORE) || "null");
    if (saved) {
      if (typeof saved.academy === "string") state.academy = saved.academy;
      if (typeof saved.gap === "number" && saved.gap >= 6 && saved.gap <= 12) state.gap = saved.gap;
      if (typeof saved.gridGap === "number" && saved.gridGap >= 3 && saved.gridGap <= 10) state.gridGap = saved.gridGap;
      if (typeof saved.duplexPrinter === "boolean") state.duplexPrinter = saved.duplexPrinter;
    }
  } catch (e) {}
  function save() {
    try {
      localStorage.setItem(STORE, JSON.stringify({
        academy: state.academy, gap: state.gap, gridGap: state.gridGap, duplexPrinter: state.duplexPrinter
      }));
    } catch (e) {}
  }

  /* ===== 시험지 생성 ===== */
  function esc(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function buildSheet(tpl) {
    var sheet = document.createElement("div");
    sheet.className = "sheet";
    var html =
      '<div class="sheet-head">' +
        '<div class="academy">' + esc(state.academy) + '</div>' +
        '<div class="head-fields">' +
          '<span class="head-field">날짜<span class="blank-line" style="width:30mm"></span></span>' +
          '<span class="head-field">이름<span class="blank-line" style="width:38mm"></span></span>' +
        '</div>' +
      '</div><div class="sections">';
    tpl.sections.forEach(function (sec) {
      html +=
        '<section class="sec" style="flex:' + sec.ratio + '">' +
          (sec.title ? '<div class="tag-row"><span class="tag">' + esc(sec.title) + '</span></div>' : '') +
          '<div class="box' + (sec.lined ? ' lined' : '') + (sec.grid ? ' grid' : '') + '"></div>' +
        '</section>';
    });
    html += '</div>';
    sheet.innerHTML = html;
    return sheet;
  }

  // 줄 위치를 mm 단위로 계산해서 넣음 (인쇄 시 선명하게)
  function fillLines(sheet) {
    var boxes = sheet.querySelectorAll(".box.lined");
    boxes.forEach(function (box) {
      box.querySelectorAll(".ln").forEach(function (n) { n.remove(); });
      var hMm = box.clientHeight * MM_PER_PX;
      // 높이는 고정, 높이를 같은 크기로 나눠 위아래 끝 간격까지 모두 동일하게 함
      var n = Math.max(1, Math.round(hMm / state.gap));
      var gap = hMm / n;
      var out = "";
      for (var k = 1; k < n; k++) {
        out += '<div class="ln" style="top:' + (k * gap).toFixed(3) + 'mm"></div>';
      }
      box.insertAdjacentHTML("beforeend", out);
      el.gapOut.textContent = gap.toFixed(1) + "mm";
    });

    sheet.querySelectorAll(".box.grid").forEach(function (box) {
      box.querySelectorAll(".gv, .gh").forEach(function (n) { n.remove(); });
      box.style.width = "";
      box.style.alignSelf = "";
      box.style.height = "";
      box.style.flex = "";
      box.style.margin = "";
      var wMm = box.clientWidth * MM_PER_PX;
      var hMm = box.clientHeight * MM_PER_PX;
      var g = state.gridGap;
      var nx = Math.floor(wMm / g), ny = Math.floor(hMm / g);
      // 가로: 테두리 안쪽 너비를 모눈 간격의 정수배로 맞춰 양 끝 칸도 동일한 너비가 되게 함
      var borderMm = (box.offsetWidth - box.clientWidth) * MM_PER_PX;
      box.style.width = (nx * g + borderMm).toFixed(2) + "mm";
      box.style.alignSelf = "center";
      // 세로: 테두리 안쪽 높이도 모눈 간격의 정수배로 맞춰 위아래 칸도 동일하게 함
      var borderYMm = (box.offsetHeight - box.clientHeight) * MM_PER_PX;
      box.style.flex = "none";
      box.style.height = (ny * g + borderYMm).toFixed(2) + "mm";
      box.style.margin = "auto 0";
      var x0 = 0, y0 = 0;
      var out = "";
      for (var i = 1; i < nx; i++) out += '<div class="gv" style="left:' + (x0 + i * g).toFixed(2) + 'mm"></div>';
      for (var j = 1; j < ny; j++) out += '<div class="gh" style="top:' + (y0 + j * g).toFixed(2) + 'mm"></div>';
      box.insertAdjacentHTML("beforeend", out);
    });
  }

  /* ===== 미리보기 ===== */
  var previewSheet = null;
  function renderPreview() {
    var tpl = TEMPLATES[state.template];
    var hasLined = tpl.sections.some(function (s) { return s.lined; });
    el.gap.disabled = !hasLined;
    el.gap.closest(".field-group").classList.toggle("is-disabled", !hasLined);
    var hasGrid = tpl.sections.some(function (s) { return s.grid; });
    el.grid.disabled = !hasGrid;
    el.grid.closest(".field-group").classList.toggle("is-disabled", !hasGrid);
    el.scaler.innerHTML = "";
    previewSheet = buildSheet(tpl);
    el.scaler.appendChild(previewSheet);
    fillLines(previewSheet);
    fitPreview();
  }
  function fitPreview() {
    if (!previewSheet) return;
    var w = previewSheet.offsetWidth, h = previewSheet.offsetHeight;
    var avail = el.stage.clientWidth;
    var cs = getComputedStyle(el.stage.parentNode);
    var availH = window.innerHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 2;
    var scale = Math.min(1, avail / w, availH / h);
    el.scaler.style.transform = "scale(" + scale + ")";
    el.scalerWrap.style.width = (w * scale) + "px";
    el.scalerWrap.style.height = (h * scale) + "px";
  }

  /* ===== 출력 모드 ===== */
  function syncMode() {
    var dbl = modeInputs[1];
    if (!state.duplexPrinter) {
      dbl.disabled = true;
      el.radioDouble.classList.add("is-disabled");
      if (state.mode === "double") state.mode = "single";
    } else {
      dbl.disabled = false;
      el.radioDouble.classList.remove("is-disabled");
    }
    modeInputs.forEach(function (r) { r.checked = (r.value === state.mode); });

    if (state.mode === "double") {
      el.modeHint.textContent = "한 장의 앞뒤에 같은 양식이 인쇄돼요.";
    } else if (state.duplexPrinter) {
      el.modeHint.textContent = "";
    } else {
      el.modeHint.textContent = "양면 출력은 양면 프린터 사용 시에만 선택할 수 있어요.";
    }
  }

  function readCopies() {
    var v = el.copies.value.trim();
    if (!/^\d+$/.test(v)) return null;
    var n = parseInt(v, 10);
    if (n < 1 || n > 500) return null;
    return n;
  }

  /* ===== 토스트 ===== */
  var toastTimer = null;
  function showToast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove("show"); }, 2200);
  }

  /* ===== 출력 ===== */
  function doPrint() {
    if (el.copies.value.trim() === "") {
      showToast("출력 부수를 입력하세요.");
      el.copies.focus();
      return;
    }
    var n = readCopies();
    if (n === null) {
      showToast("출력 부수는 1에서 500 사이로 입력하세요.");
      el.copies.focus();
      return;
    }

    fillLines(previewSheet);
    var master = previewSheet.cloneNode(true);
    master.style.boxShadow = "none";
    var blank = document.createElement("div");
    blank.className = "sheet";

    var frag = document.createDocumentFragment();
    for (var i = 0; i < n; i++) {
      frag.appendChild(master.cloneNode(true));
      if (state.mode === "double") {
        frag.appendChild(master.cloneNode(true));
      } else if (state.duplexPrinter) {
        frag.appendChild(blank.cloneNode(true));
      }
    }
    el.printArea.innerHTML = "";
    el.printArea.appendChild(frag);

    var go = function () { requestAnimationFrame(function () { window.print(); }); };
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go();
  }
  window.addEventListener("afterprint", function () { el.printArea.innerHTML = ""; });

  /* ===== 초기화 및 이벤트 ===== */
  Object.keys(TEMPLATES).forEach(function (key) {
    var o = document.createElement("option");
    o.value = key; o.textContent = TEMPLATES[key].name;
    el.template.appendChild(o);
  });
  el.template.value = state.template;
  el.academy.value = state.academy;
  el.gap.value = state.gap;
  el.gapOut.textContent = state.gap.toFixed(1) + "mm";
  el.grid.value = state.gridGap;
  el.gridOut.textContent = state.gridGap.toFixed(1) + "mm";
  el.duplexPrinter.checked = state.duplexPrinter;

  el.template.addEventListener("change", function () { state.template = el.template.value; renderPreview(); });
  el.academy.addEventListener("input", function () {
    state.academy = el.academy.value; save();
    var a = previewSheet && previewSheet.querySelector(".academy");
    if (a) a.textContent = state.academy;
  });
  el.gap.addEventListener("input", function () {
    state.gap = parseFloat(el.gap.value);
    el.gapOut.textContent = state.gap.toFixed(1) + "mm";
    fillLines(previewSheet); save();
  });
  el.grid.addEventListener("input", function () {
    state.gridGap = parseFloat(el.grid.value);
    el.gridOut.textContent = state.gridGap.toFixed(1) + "mm";
    fillLines(previewSheet); save();
  });
  el.duplexPrinter.addEventListener("change", function () {
    state.duplexPrinter = el.duplexPrinter.checked; save(); syncMode();
  });
  modeInputs.forEach(function (r) {
    r.addEventListener("change", function () { if (r.checked) { state.mode = r.value; syncMode(); } });
  });
  el.printBtn.addEventListener("click", doPrint);
  window.addEventListener("resize", fitPreview);

  syncMode();
  renderPreview();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { fillLines(previewSheet); fitPreview(); });
  }
})();
</script>
</body>
</html>
